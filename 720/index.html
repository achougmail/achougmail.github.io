<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>房产实勘员VR-南沙航拍地图</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="modal" id="modal">
        <header class="modal-header">
            <div class="logo-container">
                <img src="images/logo.png" width="35" height="35" alt="房产实勘员Logo">
                <span class="logo-title">房产实勘员VR</span>
            </div>
            <div class="header-controls">
                <span class="countdown" id="countdown" aria-label="关闭倒计时">3</span>
                <button class="btn-icon" id="pauseBtn" title="暂停/继续 (空格键)" aria-label="暂停倒计时">
                    <span id="pauseIcon">||</span>
                </button>
                <button class="btn-icon close-btn" id="closeBtn" title="立即进入" aria-label="关闭提示并进入">
                    &times;
                </button>
            </div>
        </header>

        <div class="modal-content">
            <h1 class="title">航拍地图操作指引</h1>
            <span class="content-subtitle">(按暂停键或空格键暂停倒计时；关闭本窗口进入地图系统)</span>
            
            <ul class="guide-list">
                <li>缩放视图: 查看不同层次的信息</li>
                <li>动态标签: 有关联的信息</li>
                <li>户型VR: 浏览内嵌VR户型</li>
                <li>三维户型图：浏览三维户型模型</li>
                <li>小程序：经纪人实用工具集，私域获客利器</li>
                <li>门店展示：免费定制大屏演示应用</li>
            </ul>

            <footer class="footer-info">
                <p>房产实勘员 2025-2026</p>
                <p>客户端下载<a href="https://achou.pages.dev/" target="_blank" rel="noopener">https://achou.pages.dev</a></p>
                <p>资料持续更新，欢迎反馈建议</p>
                <p>如有问题或建议，请联系：<a href="tel:+8618202029366">18202029366</a></p>
            </footer>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.getElementById('modal');
            const closeBtn = document.getElementById('closeBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const pauseIcon = document.getElementById('pauseIcon');
            const countdown = document.getElementById('countdown');
            
            const REDIRECT_URL = 'https://720zf.com/t/9dd601ee01561040';
            let timeLeft = 3;
            let timer = null;
            let isPaused = false;
            
            const startTimer = () => {
                if (timer) clearInterval(timer);
                timer = setInterval(() => {
                    timeLeft--;
                    countdown.textContent = timeLeft;
                    
                    if (timeLeft <= 0) {
                        clearInterval(timer);
                        navigateToVR();
                    }
                }, 1000);
            };
            
            const toggleTimer = () => {
                if (isPaused) {
                    isPaused = false;
                    pauseIcon.textContent = '||';
                    pauseBtn.title = '暂停 (空格键)';
                    startTimer();
                } else {
                    isPaused = true;
                    clearInterval(timer);
                    pauseIcon.textContent = '▶';
                    pauseBtn.title = '继续 (空格键)';
                }
            };
            
            const navigateToVR = () => {
                if (timer) clearInterval(timer);
                window.location.href = REDIRECT_URL;
            };
            
            // 初始化计时器
            startTimer();
            
            // 事件监听
            pauseBtn.addEventListener('click', toggleTimer);
            closeBtn.addEventListener('click', navigateToVR);
            
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space') {
                    e.preventDefault();
                    toggleTimer();
                }
            });
        });
    </script>
</body>
</html>
