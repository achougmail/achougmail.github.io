<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>湾區茶馆 - 位置导航</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <!-- 地图容器 -->
  <div id="container" class="map-container"></div>

  <!-- 信息面板 -->
  <div class="map-info-panel">
    <div class="map-info-title">湾區茶馆</div>
    <div class="map-info-address">广州市南沙区创享湾3栋一楼湾区茶馆</div>
    <div class="map-info-address">电话：18826251716</div>
    <button class="map-nav-btn" id="navBtn">点击导航到这里</button>
    <div class="map-tip">支持高德地图、百度地图、腾讯地图等导航软件</div>
  </div>

  <script type="text/javascript">
    // 高德地图API加载回调
    function initMap() {
      // 创建地图实例
      var map = new AMap.Map('container', {
        zoom: 18,
        center: [113.532747, 22.803479], // 广州市南沙区创享湾大致坐标
        mapStyle: 'amap://styles/darkblue' // 暗色地图样式
      });

      // 创建标记点
      var marker = new AMap.Marker({
        position: [113.532747, 22.803479],
        title: '湾區茶馆',
        icon: new AMap.Icon({
          size: new AMap.Size(40, 40),
          image: 'https://webapi.amap.com/theme/v1.3/markers/n/mark_b.png',
          imageSize: new AMap.Size(20, 30)
        })
      });

      // 将标记添加到地图
      map.add(marker);

      // 创建信息窗口
      var infoWindow = new AMap.InfoWindow({
        content: '<div style="padding: 10px;">' +
                 '<h4 style="color: #f0c040; margin-bottom: 5px;">湾區茶馆</h4>' +
                 '<p style="color: #fff; font-size: 14px;">广州市南沙区创享湾3栋一楼</p>' +
                 '</div>',
        offset: new AMap.Pixel(0, -20)
      });

      // 点击标记显示信息窗口
      marker.on('click', function() {
        infoWindow.open(map, marker.getPosition());
      });

      // 自动打开信息窗口
      infoWindow.open(map, marker.getPosition());
    }

    // 导航按钮点击事件
    document.getElementById('navBtn').addEventListener('click', function() {
      var address = encodeURIComponent('广州市南沙区创享湾3栋一楼湾区茶馆');
      var lat = 22.803479;
      var lng = 113.532747;

      // 优先尝试高德地图导航
      if (isGaoDeApp()) {
        window.location.href = 'amapuri://route/plan?dlat=' + lat + '&dlon=' + lng + '&dname=' + address + '&dev=0';
      } else if (isBaiduMapApp()) {
        window.location.href = 'baidumap://map/direction?destination=name:' + address + '|latlng:' + lat + ',' + lng + '&mode=driving';
      } else if (isTencentMapApp()) {
        window.location.href = 'qqmap://map/routeplan?type=drive&to=' + address + '&tocoord=' + lat + ',' + lng;
      } else {
        // 打开高德地图网页版
        window.open('https://uri.amap.com/marker?position=' + lng + ',' + lat + '&name=' + address + '&callnative=0');
      }
    });

    // 判断是否在高德地图App中
    function isGaoDeApp() {
      var ua = navigator.userAgent.toLowerCase();
      return ua.indexOf('amap') !== -1 || ua.indexOf('autonavi') !== -1;
    }

    // 判断是否在百度地图App中
    function isBaiduMapApp() {
      var ua = navigator.userAgent.toLowerCase();
      return ua.indexOf('baidumap') !== -1;
    }

    // 判断是否在腾讯地图App中
    function isTencentMapApp() {
      var ua = navigator.userAgent.toLowerCase();
      return ua.indexOf('qqmap') !== -1 || ua.indexOf('qqmapview') !== -1;
    }
  </script>

  <!-- 加载高德地图API -->
  <script type="text/javascript" src="https://webapi.amap.com/maps?v=1.4.15&key=您的高德地图APIKey&callback=initMap"></script>

  <!-- 地图加载失败备用 -->
  <script type="text/javascript">
    setTimeout(function() {
      if (typeof AMap === 'undefined') {
        document.getElementById('container').innerHTML = `
          <div style="width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px;">
            <div style="font-size: 3rem; margin-bottom: 20px;">📍</div>
            <h2 style="color: #f0c040; margin-bottom: 10px;">湾區茶馆</h2>
            <p style="color: #ccc; margin-bottom: 5px;">地址：广州市南沙区创享湾3栋一楼</p>
            <p style="color: #666; font-size: 0.9rem;">地图加载失败，请检查网络连接</p>
          </div>
        `;
      }
    }, 5000);
  </script>
</body>
</html>
