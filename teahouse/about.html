<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>关于 - 湾區茶馆</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
    }
    .about-container {
      padding: 60px 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .about-title {
      text-align: center;
      color: #f0c040;
      font-size: 2rem;
      margin-bottom: 40px;
      font-weight: 300;
    }
    .about-section {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 24px;
      border: 1px solid rgba(240, 192, 64, 0.1);
    }
    .section-title {
      color: #f0c040;
      font-size: 1.3rem;
      margin-bottom: 16px;
      font-weight: 500;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(240, 192, 64, 0.2);
    }
    .section-content {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.95rem;
      line-height: 1.8;
    }
    .contact-info {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }
    .contact-item {
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.95rem;
    }
    .contact-item svg {
      width: 18px;
      height: 18px;
      color: #f0c040;
    }
    .footer-text {
      text-align: center;
      color: rgba(255, 255, 255, 0.3);
      font-size: 0.85rem;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="about-container">
    <h1 class="about-title">关于湾區茶馆</h1>
    
    <div class="about-section">
      <div class="section-title">品牌理念</div>
      <div class="section-content">
        湾區茶馆致力于打造一个集茶品体验、文化交流、生活美学于一体的空间。我们相信，一杯好茶不仅是味蕾的享受，更是心灵的滋养。
      </div>
    </div>
    
    <div class="about-section">
      <div class="section-title">经营宗旨</div>
      <div class="section-content">
        传承中华茶文化，融合现代生活方式，为都市人提供一个放松身心、品味生活的第三空间。
      </div>
    </div>
    
    <div class="about-section">
      <div class="section-title">联系我们</div>
      <div class="contact-info">
        <div class="contact-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <span>广州市南沙区创享湾3栋一楼湾區茶馆</span>
        </div>
        <div class="contact-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 5a2 2 0 0 1 2-2h3.28a1 1 0 0 1 .948.684l1.498 4.493a1 1 0 0 1-.502 1.21l-2.257 1.13a11.042 11.042 0 0 0 5.516 5.516l1.13-2.257a1 1 0 0 1 1.21-.502l4.493 1.498a1 1 0 0 1 .684.949V19a2 2 0 0 1-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
          </svg>
          <span>18826251716</span>
        </div>
        <div class="contact-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 12a4 4 0 1 0-8 0 4 4 0 0 0 8 0zm0 0v1.5a2.5 2.5 0 0 0 5 0V12a9 9 0 1 0-9 9m4.5-1.206a8.959 8.959 0 0 1-4.5 1.207"/>
          </svg>
          <span>营业时间：10:00 - 22:00</span>
        </div>
      </div>
    </div>
    
    <div class="footer-text">
      湾區茶馆 © 2024 · 用心做好茶
    </div>
  </div>
</body>
</html>
