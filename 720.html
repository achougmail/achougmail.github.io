<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR 展示</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Microsoft YaHei", Arial, sans-serif;
        }

        /* 全屏 iframe 样式 */
        #vr-iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }

        /* 弹窗遮罩层 */
        #modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        /* 弹窗容器 */
        #modal-container {
            background-color: #fff;
            width: 80%;
            max-width: 500px;
            min-height: 300px;
            border-radius: 8px;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            padding: 20px;
            box-sizing: border-box;
        }

        /* 关闭按钮 */
        #close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            color: #666;
            cursor: pointer;
            border: none;
            background: none;
            padding: 0;
            line-height: 1;
            transition: color 0.3s;
        }

        #close-btn:hover {
            color: #000;
        }

        /* 倒计时提示 */
        #countdown-text {
            position: absolute;
            top: 16px;
            right: 45px;
            font-size: 14px;
            color: #999;
        }

        /* 弹窗内容 */
        #modal-content {
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- 全屏嵌入 VR 页面 -->
    <iframe 
        id="vr-iframe" 
        src="https://720zf.com/t/9dd601ee01561040" 
        allowfullscreen 
        allow="autoplay; fullscreen; xr-spatial-tracking; clipboard-write; encrypted-media; gyroscope; accelerometer; magnetometer;"
        referrerpolicy="no-referrer-when-downgrade">
    </iframe>

    <!-- 弹窗提示 -->
    <div id="modal-overlay">
        <div id="modal-container">
            <span id="countdown-text">5s</span>
            <button id="close-btn" title="关闭">&times;</button>
            <div id="modal-content">
                <h3 style="margin-top: 0;">欢迎使用 VR 展示</h3>
                <p style="color: #666; font-size: 14px; line-height: 1.6;">
                    如果遇到无法登录或页面加载异常：<br>
                    1. 请确保浏览器未禁用<b>第三方 Cookie</b>。<br>
                    2. 建议在 HTTPS 环境下访问本页面。<br>
                    3. 若仍有问题，请尝试点击右上角关闭此提示后再操作。
                </p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const overlay = document.getElementById('modal-overlay');
            const closeBtn = document.getElementById('close-btn');
            const countdownText = document.getElementById('countdown-text');
            
            let timeLeft = 5;
            let timer = null;

            // 关闭弹窗的函数
            function closeModal() {
                overlay.style.display = 'none';
                if (timer) clearInterval(timer);
            }

            // 倒计时逻辑
            timer = setInterval(function() {
                timeLeft--;
                if (timeLeft <= 0) {
                    closeModal();
                } else {
                    countdownText.textContent = timeLeft + 's';
                }
            }, 1000);

            // 点击关闭按钮隐藏弹窗
            closeBtn.addEventListener('click', closeModal);

            // 点击遮罩层也可以关闭
            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) {
                    closeModal();
                }
            });
        });
    </script>
</body>
</html>
