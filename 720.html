<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>720</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            width: 60%;
            max-width: 600px;
            min-width: 280px;
        }
        
        .modal-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .countdown {
            width: 32px;
            height: 32px;
            margin-right: 10px;
            color: #666;
            font-size: 16px;
            background: transparent;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .pause-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            margin-right: 10px;
            color: #666;
        }
        
        .pause-btn:hover {
            background-color: #f0f0f0;
        }
        
        .close-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            color: #666;
        }
        
        .close-btn:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="modal" id="modal">
        <div class="modal-header">
            <span class="countdown" id="countdown">5</span>
            <button class="pause-btn" id="pauseBtn">||</button>
            <button class="close-btn" id="closeBtn">&times;</button>
        </div>
        <div class="modal-content">
            <h2>房产实勘员VR</h2><br>
            航拍地图操作指引
            <p
            <br>
            <br>
            详细操作正在制作中，请稍候......
            <br>
            所有内容自动更新，无需手动操作
            <br>
            <br>
            <br>
            </p>
            @Copyright 房产实勘员 2026<br>
            https://achou.pages.dev/<br>
            如有问题或建议，请联系182-0202-9366
        </div>
    </div>

    <script>
        const modal = document.getElementById('modal');
        const closeBtn = document.getElementById('closeBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const countdown = document.getElementById('countdown');
        
        let timeLeft = 5;
        let timer = null;
        let isPaused = false;
        
        function startTimer() {
            timer = setInterval(() => {
                timeLeft--;
                countdown.textContent = timeLeft;
                
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    closeModal();
                }
            }, 1000);
        }
        
        function pauseTimer() {
            clearInterval(timer);
            isPaused = true;
            pauseBtn.textContent = '▶';
        }
        
        function resumeTimer() {
            isPaused = false;
            pauseBtn.textContent = '||';
            startTimer();
        }
        
        function closeModal() {
            modal.style.display = 'none';
            window.location.href = 'https://720zf.com/t/9dd601ee01561040';
        }
        
        startTimer();
        
        pauseBtn.addEventListener('click', () => {
            if (isPaused) {
                resumeTimer();
            } else {
                pauseTimer();
            }
        });
        
        closeBtn.addEventListener('click', () => {
            clearInterval(timer);
            closeModal();
        });
    </script>
</body>
</html>
