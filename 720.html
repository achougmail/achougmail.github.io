<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>720</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }
        
        .modal-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .countdown {
            margin-right: 10px;
            color: #666;
            font-size: 14px;
        }
        
        .close-btn {
            width: 24px;
            height: 24px;
            border: none;
            background-color: #eee;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
        }
        
        .close-btn:hover {
            background-color: #ddd;
        }
    </style>
</head>
<body>
    <div class="modal" id="modal">
        <div class="modal-header">
            <span class="countdown" id="countdown">5</span>
            <button class="close-btn" id="closeBtn">&times;</button>
        </div>
        <div class="modal-content">房产实勘员VR航拍地图操作指引</div>
    </div>

    <script>
        const modal = document.getElementById('modal');
        const closeBtn = document.getElementById('closeBtn');
        const countdown = document.getElementById('countdown');
        
        let timeLeft = 5;
        
        const timer = setInterval(() => {
            timeLeft--;
            countdown.textContent = timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(timer);
                closeModal();
            }
        }, 1000);
        
        function closeModal() {
            modal.style.display = 'none';
            window.location.href = 'https://720zf.com/t/9dd601ee01561040';
        }
        
        closeBtn.addEventListener('click', () => {
            clearInterval(timer);
            closeModal();
        });
    </script>
</body>
</html>
